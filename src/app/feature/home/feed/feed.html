<div class="flex justify-center mt-10">
  @if(feedState$ | async; as feedItems){
    @if(feedItems.length > 0){
        <app-feed-card [feedItem]="feedItems[0]" (status)="handleConnection($event, feedItems[0]._id)"/>
    }
    @else{
      <p class="text-center text-gray-500">No feed items available.</p>
    }
  }
</div>
