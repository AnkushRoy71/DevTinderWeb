<div class="flex justify-center align-center mt-10">
  <p-card
    class="max-w-sm w-full"
    header="Welcome back"
    subheader="Sign in with your email to continue."
  >
    <form class="space-y-6 mt-3" (submit)="onSubmit($event)">
      <div class="flex flex-col gap-2">
        <label pLabel for="email">Email</label>
        <input pInputText [formField]="loginForm.email" id="email" type="email" />
      </div>
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label pLabel for="password" class="flex-1">Password</label>
          <button type="button" pButton variant="link" class="p-0">Forgot password?</button>
        </div>
        <input pInputText [formField]="loginForm.password" id="password" type="password" />
      </div>
      <button type="submit" pButton class="w-full">Login</button>
    </form>
    <ng-template #footer>
      <div class="flex flex-col gap-4">
        <button type="button" pButton severity="secondary" [outlined]="true" class="w-full">
          Login with Google
        </button>
        <div class="mt-2 text-center text-surface-500 text-sm">
          Don't have an account?
          <button type="button" pButton variant="link" class="p-0" routerLink="/register">
            Sign up
          </button>
        </div>
      </div>
    </ng-template>
  </p-card>
</div>
