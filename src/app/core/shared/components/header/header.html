<p-menubar>
  <ng-template #start>
    <h5 class="p-2">🧑‍💻 DevTinder</h5>
  </ng-template>
  <ng-template #end>
    @if(user$ | async; as user){
      <div class="flex items-center gap-2">
        <p class="w-36" >Welcome, {{ user.firstName }}</p>
        <p-avatar
          image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
          shape="circle"
        />
      </div>
    }
  </ng-template>
</p-menubar>
